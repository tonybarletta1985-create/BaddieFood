<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taste Tour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EFE7FF">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Taste Tour</title>
<style>
:root{--sky:#EFE7FF;--ink:#2A1F4D;--grass:#1FB5A5;--mint:#DDF7EF;--sun:#FFC857;--berry:#FF4F9A;--lilac:#7B5CFF;--card:#fff;--muted:#5E5780}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4}
body{padding-top:env(safe-area-inset-top);min-height:100vh;min-height:100dvh}
#app{max-width:820px;margin:0 auto;padding:12px 14px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:19px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--lilac);outline-offset:2px}

header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px;font-weight:800;min-height:44px}
.chip.sun{background:var(--sun)}
.chip.on{background:var(--mint)}
.iconbtn{width:48px;height:48px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink)}

.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:16px;margin:0 0 18px}
.card.mint{background:var(--mint)}
.card.sun{background:#FFF0C9}
.card.pink{background:#FFE3F0}
.big{display:block;width:100%;min-height:62px;border:3px solid var(--ink);border-radius:20px;background:var(--berry);color:#fff;font-size:21px;font-weight:800;box-shadow:0 5px 0 var(--ink);padding:12px 16px}
.big:active,.btn:active,.iconbtn:active,.rg:active,.face:active,.qo:active,.ob:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn{min-height:50px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:700;padding:8px 16px;box-shadow:0 4px 0 var(--ink)}
.btn.grass{background:var(--grass);color:#fff}
.btn.sun{background:var(--sun)}
.btn.berry{background:var(--berry);color:#fff}
.btn.sm{min-height:42px;padding:4px 12px;font-size:16px}
.btn[disabled]{opacity:.45}
.ghost{min-height:48px;border:0;background:none;text-decoration:underline;font-weight:700;padding:8px}
.link{border:0;background:none;text-decoration:underline;font-weight:800;padding:0;color:var(--lilac)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.fchip{min-height:44px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;padding:4px 14px}
.fchip.on{background:var(--sun)}

.layout{display:block}
.side{display:none}
.layout.home-tab .side{display:block}

.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble:before{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0;z-index:1}
.qh{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:4px}
.qq{font-size:20px;font-weight:800;margin:2px 0 10px}
.qopts{display:grid;gap:8px}
.qo{min-height:54px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:700;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
.qo.ok{background:var(--mint)}
.qo.no{background:#FFD9E6}
.qo[disabled]{opacity:1;cursor:default}
.speak{min-height:40px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:18px;padding:0 10px}
.scene{position:relative;height:350px;border:3px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:0 6px 0 var(--ink);margin-bottom:20px}
.scene .deco{position:absolute;line-height:1;pointer-events:none}
.scene .pet{position:absolute;left:50%;bottom:0;width:200px;height:300px;margin-left:-100px;animation:bob 3.4s ease-in-out infinite;cursor:pointer}
.scene .pet svg{width:100%;height:100%}
.scene .pet.jump{animation:jump .6s ease-out}
.lvl{position:absolute;right:12px;top:12px;z-index:2;text-align:center;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:800;line-height:1.15}
.lvl small{display:block;font-size:12px;font-weight:700}
.eyes{animation:blink 5s infinite;transform-origin:50% 50%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-34px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);transition:width .5s}

.glow{display:flex;gap:10px;flex-wrap:wrap}
.gl{flex:1 1 150px;min-height:78px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px;text-align:center;font-weight:700;font-size:15px}
.gl span{display:block;font-size:30px;line-height:1.1;filter:grayscale(1);opacity:.45}
.gl.on{background:var(--mint)}
.gl.on span{filter:none;opacity:1}

.lvtag{display:inline-block;font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--mint);vertical-align:middle}
.lvtag.l2{background:#FFF0C9}
.lvtag.l3{background:#FFD0E4}
.ladder{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;min-height:58px}
.rg .ic{font-size:26px;filter:grayscale(1);opacity:.4}
.rg b{display:block}
.rg .m{font-size:15px;color:var(--muted);font-weight:500}
.rg .pts{margin-left:auto;font-weight:800;white-space:nowrap}
.rg.done{background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.rg.done .ic,.rg.next .ic{filter:none;opacity:1}
.rg.next{border-style:dashed;box-shadow:0 4px 0 var(--ink)}
.rg.lock{opacity:.55}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px solid #EEE8FA}
.mrow:first-of-type{border-top:0}
.mrow .e{font-size:30px}
.mrow .t{flex:1}
.mrow.ok{opacity:.7}

details{border:3px solid var(--ink);border-radius:16px;background:#fff;margin:10px 0}
summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;min-height:52px;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:26px}
details[open] summary::after{content:"−"}
details .in{padding:0 14px 12px}
.grid2{display:block}
select,input[type=text],input[type=number]{font:inherit;width:100%;min-height:52px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink)}
.reward{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid #EEE8FA}
.reward:first-of-type{border-top:0}
.reward .e{font-size:32px}
.reward .t{flex:1}
.bigbal{font-size:40px;font-weight:900;line-height:1.05}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:2px solid #F0EBFA;font-size:16px}
.logrow:first-child{border-top:0}
.stars{font-size:22px;letter-spacing:1px;color:#E0A100}
.tag{display:inline-block;font-size:13px;font-weight:700;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin:0 4px 4px 0}
.passgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pp{border:3px dashed var(--ink);border-radius:18px;text-align:center;padding:8px 2px;font-size:13px;font-weight:700;background:#fff;min-height:96px}
.pp span{display:block;font-size:30px;filter:grayscale(1);opacity:.4}
.pp small{display:block;font-weight:600;color:var(--muted)}
.pp.on{border-style:solid;background:var(--mint);box-shadow:0 3px 0 var(--ink)}
.pp.on span{filter:none;opacity:1}
.mini{flex:0 0 46px;height:46px}
.mini svg{width:46px;height:46px;display:block}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;gap:6px;width:100%;max-width:820px}
.tab{flex:1;border:3px solid transparent;border-radius:16px;background:none;min-height:60px;font-weight:700;font-size:14px;padding:4px 2px}
.tab span{display:block;font-size:26px;line-height:1.1}
.tab.on{background:var(--sun);border-color:var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(42,31,77,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.sheet{background:var(--sky);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;width:100%;max-width:820px;max-height:90vh;max-height:90dvh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:12px 14px;margin-bottom:10px;min-height:64px;box-shadow:0 4px 0 var(--ink)}
.opt .e{font-size:34px}
.opt b{display:block}
.opt small{display:block;color:var(--muted);font-size:15px}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.dots i{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto 10px}
.key{height:62px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.key:active{transform:translateY(4px);box-shadow:none}
.center{text-align:center}

.studio-prev{width:190px;height:285px;margin:0 auto 6px}
.studio-prev svg{width:100%;height:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:10px 0 16px}
.ob{border:3px solid var(--ink);border-radius:14px;background:#fff;min-height:58px;padding:6px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.ob.sel{background:var(--sun)}
.ob.lock{opacity:.5}
.ob small{display:block;font-weight:600;color:var(--muted)}
.sw{display:block;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);margin:0 auto 4px}
.starbtn{font-size:36px;background:none;border:0;min-width:50px;min-height:52px;color:#C9BEE6;padding:0}
.starbtn.on{color:#E0A100}

.faces{display:flex;gap:12px;margin-top:8px}
.face{flex:1;min-height:104px;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:4px 4px 8px;font-weight:700;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.face svg{display:block;width:70px;height:70px;margin:0 auto 2px}
.face.h{background:var(--mint)}
.face.s{background:#FFD9E6}
.face.m{background:#FFF0C9}

.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.scard{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 4px;text-align:center;font-weight:700;font-size:15px;min-height:96px;box-shadow:0 4px 0 var(--ink)}
.scard span{display:block;font-size:34px}
.scard.sel{background:var(--sun)}
.onb-prev{width:190px;height:285px;margin:0 auto}
.onb-prev svg{width:100%;height:100%}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.fx span{position:absolute;bottom:35%;font-size:30px;animation:pop 1.3s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.2) rotate(40deg);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

@media (min-width:700px) and (orientation:landscape){
  #app{max-width:1280px;padding-left:22px;padding-right:22px}
  .layout{display:grid;grid-template-columns:minmax(340px,38%) minmax(0,1fr);gap:24px;align-items:start}
  .side{display:block;position:sticky;top:8px;max-height:calc(100vh - 150px);overflow:auto;padding:4px 4px 10px}
  .scene{height:min(44vh,360px)}
  .scene .pet{width:150px;height:225px;margin-left:-75px}
  .qo{min-height:48px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}
  .grid2>details{margin:0}
  nav.tabs .in{max-width:1280px}
  .sheet{max-width:680px;border-radius:28px;border-bottom:3px solid var(--ink);margin-bottom:4vh}
  .overlay{align-items:center}
}
@media (orientation:landscape) and (max-height:560px){
  .scene{height:200px;margin-bottom:12px}
  .scene .pet{width:112px;height:168px;margin-left:-56px}
  .side{max-height:calc(100vh - 128px)}
  .bubble{font-size:16px;padding:8px 12px}
  header.top{padding-bottom:6px}
  .tab{min-height:50px}
  .tab span{font-size:20px}
}
@media (min-width:600px) and (orientation:portrait){
  #app{max-width:860px}
  .scene{height:400px}
  .scene .pet{width:240px;height:360px;margin-left:-120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* Taste Tour quiz bank (ages 10-11). T = true/false, Y = yes/no, M = multiple choice (correct answer listed first, shuffled on screen). */
const QUIZ=[];
const T=(q,a,x)=>QUIZ.push({t:'tf',q,o:['True','False'],c:a?0:1,x});
const Y=(q,a,x)=>QUIZ.push({t:'yn',q,o:['Yes','No'],c:a?0:1,x});
const M=(q,o,c,x)=>QUIZ.push({t:'mc',q,o,c,x});

/* ---- Nutrition science ---- */
M("Which of these is a macronutrient?",["Carbohydrate","Vitamin C","Iron","Calcium"],0,"Macronutrients are carbs, protein and fat. Vitamins and minerals are micronutrients.");
M("Which macronutrient is your body's preferred quick fuel?",["Carbohydrate","Protein","Water","Fibre"],0,"Carbs are broken down into glucose, which fuels your brain and muscles.");
T("Fat is a nutrient your body does not need.",0,"It gives energy, supports your brain and helps you absorb vitamins A, D, E and K.");
M("Which vitamins need fat to be absorbed?",["A, D, E and K","B and C","Only C","None of them"],0,"Those are the fat-soluble vitamins.");
M("Which vitamin helps your blood clot?",["Vitamin K","Vitamin C","Vitamin B12","Vitamin A"],0,"Leafy greens like spinach and kale are good sources.");
M("Vitamin B12 is found mostly in:",["Animal foods and fortified foods","Fruit","Nuts only","Sugar"],0,"People who eat no animal foods need fortified foods or a supplement.");
T("Soluble fibre is only found in meat.",0,"Oats, beans and apples are good sources.");
M("Which food is a good source of potassium?",["Banana","White rice","Butter","Lollies"],0,"Potassium helps your muscles and heart. Potatoes and beans have lots too.");
M("Omega-3 fats are found in:",["Salmon and walnuts","White bread","Soft drink","Rice"],0,"They support your brain and heart.");
T("Probiotics are harmful bacteria found in yoghurt.",0,"They are friendly bacteria that support a healthy gut.");
M("What are antioxidants?",["Plant compounds that help protect cells","A type of sugar","A kind of salt","A cooking tool"],0,"Berries, tomatoes and leafy greens are packed with them.");
M("Which mineral is added to a lot of salt to support your thyroid?",["Iodine","Iron","Zinc","Copper"],0,"Iodine helps make thyroid hormones.");
T("A complete protein has only two amino acids.",0,"It has all nine essential amino acids.");
M("Which of these is a plant source of protein?",["Lentils","Lettuce","Cucumber","Apple"],0,"Lentils, beans, tofu and nuts all have protein.");
T("Beans and rice together make a poor mix of amino acids.",0,"They complement each other well.");
M("Which mineral helps carry oxygen in your blood?",["Iron","Calcium","Sodium","Potassium"],0,"Iron is part of haemoglobin.");
T("Vitamin C blocks iron absorption from plant foods.",0,"It helps you absorb it. Try tomato with your beans.");
M("Which nutrient is vital for building strong bones during childhood and teen years?",["Calcium","Sugar","Fibre","Caffeine"],0,"Most of your bone strength is built while you are growing.");
M("What is one main job of water in your body?",["Moving nutrients and keeping you cool","Making muscles","Growing hair only","Making vitamins"],0,"It also helps your kidneys and brain work.");
T("Fibre is only found in plant foods.",1,"Meat, eggs and dairy have none.");
M("Which has more fibre?",["Wholemeal bread","White bread","Cheese","Butter"],0,"Wholemeal keeps the bran and germ of the grain.");
M("Which food is a good source of folate?",["Leafy greens","Lollies","Butter","Soft drink"],0,"Folate helps your body make new cells.");
T("Zinc has nothing to do with healing.",0,"Zinc helps your immune system and wound healing.");
M("Which foods are top sources of zinc?",["Red meat and seeds","Cucumber","Lettuce","Apple"],0,"Zinc is a mineral your body can't store much of.");
T("Sodium is the part of salt that your body needs in small amounts.",1,"Too much isn't good for your heart.");
M("What gives tomatoes and red capsicums their red colour?",["Natural plant pigments","Food dye","Sugar","Salt"],0,"Carotenoids and lycopene are the pigments.");
T("Eating a variety of colours of plants gives you a variety of nutrients.",1,"That's the idea of eating a rainbow.");
M("Which of these is a whole grain?",["Brown rice","White rice","White bread","Cornflour"],0,"Whole grains keep all parts of the seed.");
M("You make which vitamin when sunshine touches your skin?",["Vitamin D","Vitamin C","Vitamin A","Vitamin B12"],0,"Always combine sun with sun protection.");
T("Calcium and vitamin D work together for strong bones.",1,"Vitamin D helps you absorb calcium.");
M("Amino acids are the building blocks of:",["Protein","Fat","Fibre","Sugar"],0,"Your body uses them to build and repair muscles.");
T("Your body can make all the amino acids it needs without food.",0,"Nine essential amino acids must come from food.");
M("Which organ makes bile to help you digest fat?",["Liver","Heart","Lungs","Kidneys"],0,"Bile is stored in the gallbladder.");
T("Most nutrients are absorbed in your small intestine.",1,"It is lined with tiny finger-like villi.");
M("The 'per 100 g' column on a nutrition label helps you:",["Compare foods fairly","Know the price","See the farm","Find the best-before date"],0,"Serving sizes can differ, per 100 g makes it fair.");

/* ---- Growing years and body fuel ---- */
T("Growing kids and teens often need more food during growth spurts.",1,"Your body is building bones, muscle and brain connections.");
M("Why do many girls need extra iron once periods start?",["Some iron is lost in period blood","Iron makes hair longer","Iron cools you down","Iron is a vitamin"],0,"Red meat, beans and leafy greens help, especially with vitamin C.");
T("Skipping meals helps your brain concentrate better.",0,"Regular meals keep your brain fuelled.");
M("What is the best drink for most sports and play?",["Water","Energy drink","Soft drink","Coffee"],0,"Water does the job for most activity.");
T("Energy drinks are recommended for kids and teens.",0,"They contain lots of caffeine and sugar, and health experts advise against them for kids.");
T("Sleep has no effect on hunger.",0,"Not enough sleep can make you hungrier and crave sugary foods.");
M("About how much sleep do 9 to 13 year olds need each night?",["9 to 11 hours","4 to 5 hours","6 hours","14 hours"],0,"Sleep helps growth, mood and learning.");
T("No single food is 'good' or 'bad'. The overall pattern of eating matters most.",1,"Variety and balance beat labels.");
M("How can your body tell you it's hungry?",["Signals like a rumbly tummy or low energy","Only the clock","What friends are eating","Ads on your phone"],0,"Listening to hunger and fullness is a skill.");
T("You should always finish everything on your plate, even when you are full.",0,"Eating when hungry and stopping when comfortably full is a healthy habit.");
M("A good snack before sport is:",["A banana or toast","Lollies only","Nothing at all","An energy drink"],0,"Carbs give quick, easy fuel.");
T("Fruit and veg contain no water.",0,"Watermelon, cucumber and oranges are mostly water.");
M("A sign you might need water is:",["Dark yellow wee and feeling tired","Cold toes","Curly hair","Itchy ears"],0,"Pale yellow is the goal.");
T("Calcium-rich foods include yoghurt, cheese, milk and tofu.",1,"Some canned fish with soft bones too.");
M("Which meal gives your body fuel after a night of sleep?",["Breakfast","Dinner","Supper","Afternoon tea"],0,"The word means breaking the overnight fast.");
T("Comparing your body or your eating to people online is a good guide for you.",0,"Everyone grows at their own pace and photos can be edited.");
M("Who is the best person to ask about nutrition for growing?",["A doctor or dietitian","A random post","A friend's guess","An ad"],0,"They know your needs.");
T("Cutting out whole food groups is a good idea for growing teens.",0,"Growing bodies need variety.");
M("Which gives steadier energy through the afternoon?",["A mix of protein, fibre and carbs","Only lollies","Only a drink","Skipping lunch"],0,"Balanced meals keep you going.");
T("Your muscles use protein to repair after exercise.",1,"That's why a snack with protein is handy after sport.");
M("A good snack after sport is:",["Yoghurt and fruit","Lollies only","Soft drink","Nothing"],0,"Protein plus carbs.");
T("Teens need less calcium than younger kids.",0,"Bone growth speeds up in the teen years, so they need more.");
M("Which of these supports mood and focus?",["Regular meals, sleep, movement and water","Only caffeine","Only sugar","Skipping meals"],0,"Healthy habits work together.");
T("Enjoying treats with friends is a normal, healthy part of life.",1,"Food is also about fun and connection.");
M("During growth years your appetite can:",["Go up and down","Never change","Disappear","Stay the same forever"],0,"Some days you're hungrier than others.");
M("Which of these is a great way to enjoy food with others?",["Share meals and chat","Eat alone on a screen","Skip meals","Only watch food videos"],0,"Eating together is linked with better eating habits.");
T("Hair is mostly made of a protein called keratin.",1,"Your body builds hair from protein.");
T("Eating a lot of protein makes hair grow overnight.",0,"Hair grows slowly. A balanced diet supports it.");
M("Which nutrients help hair and nails stay strong as part of a balanced diet?",["Protein and iron","Only sugar","Only salt","Only water"],0,"Variety matters more than any one nutrient.");

/* ---- Food media and marketing smarts ---- */
T("A 'detox' diet is needed to clean your body.",0,"Your liver and kidneys already do that job.");
M("What should you do if a food trend online looks risky?",["Check a trusted source and ask a grown-up","Try it straight away","Share it with everyone","Ignore the risk"],0,"Always check first.");
T("Influencers always tell you the whole truth about products.",0,"Many are paid to promote products.");
M("What does #ad or 'sponsored' mean?",["They were paid to promote it","It's the best product","It's free for all","It's a health claim"],0,"Paid posts can still be fun, but keep your eyes open.");
T("'Natural' on a label always means healthy.",0,"Sugar and salt are natural too.");
M("A 'superfood' is:",["A marketing word, not a scientific category","A food with powers","A medicine","A legal term"],0,"Lots of foods are great. No single one is magic.");
T("One superfood can fix your whole diet.",0,"No single food can do that. Variety wins.");
M("A product says 'sugar free'. What should you check?",["The rest of the label","Only the colour","Only the price","Nothing"],0,"It might still have lots of fat, salt or sweeteners.");
T("Supplements are always better than eating real food.",0,"Food comes with fibre and thousands of helpful compounds.");
M("Best first step before taking a supplement:",["Ask a doctor or pharmacist","Ask an influencer","Copy a friend","Guess"],0,"Some can be harmful in the wrong amount.");
T("Before-and-after photos online are always unedited.",0,"Lighting, angles and filters change a lot.");
M("What is a good sign a health claim is reliable?",["Backed by research from trusted experts","Lots of likes","A celebrity said it","A pretty photo"],0,"Look for real evidence.");
T("Likes and views show a claim is true.",0,"Popular isn't the same as correct.");
M("Companies use bright packaging and cartoons on foods to:",["Get kids' attention","Make the food healthier","Save money","Make it safer"],0,"Marketing is designed to grab you.");
T("'High protein' on a snack bar means the whole bar is healthy.",0,"Check the sugar and ingredient list too.");
M("Which is a trustworthy place for food facts in Australia?",["Eat For Health (Australian Government)","A random video","A comments section","A stranger's post"],0,"Government health sites and dietitians are reliable.");
T("Some viral challenges, like cooking chicken in medicine, are dangerous.",1,"Never try unsafe food challenges.");
M("Before copying a viral recipe, you should:",["Check it's safe and ask a grown-up","Just try it","Do it in secret","Dare a friend"],0,"Safety first.");
T("A 'what I eat in a day' video shows what everyone should eat.",0,"Everyone's needs are different.");
M("'Clean eating' is:",["A trendy phrase with no single meaning","A scientific rule","A law","A medicine"],0,"Food isn't dirty or clean. Variety is the goal.");
T("Some accounts online promote extreme diets that are unsafe for growing bodies.",1,"If a post makes you feel bad about food or your body, tell a trusted adult.");
M("If a post makes you feel worried about your body, a good move is to:",["Talk to a trusted adult","Follow the plan","Hide it","Copy it"],0,"You don't have to handle it alone.");
T("Food ads on social media are only there to help you.",0,"They are designed to make you want things.");
M("Why do snack brands sponsor sports and events?",["To link their brand with fun feelings","To make food safer","To teach nutrition","To lower prices"],0,"Marketing builds happy associations.");
T("Ingredient lists are in random order.",0,"They are listed from most to least.");
M("In an ingredient list, the first ingredient is:",["The one there is the most of","The one there is the least of","Random","The healthiest"],0,"It's ordered by weight.");
T("A long list of unfamiliar ingredients always means a food is unsafe.",0,"The sugar, salt and fat levels matter most.");
M("'Serving size' on a label tells you:",["The amount the numbers are based on","How much you must eat","What a kid must eat","The price"],0,"A packet can hold more than one serving.");
T("A packet always contains exactly one serving.",0,"Check how many servings are in it.");

function unlockText(lv){
  const out=[];
  OUTFITS.forEach(o=>{if(o.lv===lv)out.push(o.n)});
  [HEADS,FACES,EARS,NECKS].forEach(a=>a.forEach(x=>{if(x[2]===lv&&x[0]!=='none')out.push(x[1])}));
  [LIPS,EYES].forEach(a=>a.forEach(x=>{if(x[3]===lv&&x[0]!=='none')out.push(x[1]+(a===LIPS?' lips':' eyeshadow'))}));

/* ============ day and week logic ============ */
function rollover(){
  const t=todayStr();
  if(S.date===t)return;
  S.date=t;S.glow={b:false,r:false,w:false};
  if(S.lastStep!==yesterdayStr())S.streak=0;
  const ws=weekStartOf(new Date());
  if(ws!==S.week.start)S.week=freshWeek();
  save();
}
const inPlaylist=id=>S.playlist.find(p=>p.id===id);
const inTrials=id=>S.trials.find(p=>p.id===id);
const isKnown=id=>S.known.includes(id);
const stopOf=k=>STOPS.find(s=>s.k===k)||{k:'xx',n:'My own finds',e:'🍽️'};
function featuredStop(){
  const list=STOPS.filter(s=>s.k!=='pr');
  const wi=Math.floor(new Date(S.week.start+'T12:00:00')/(7*864e5));
  return list[wi%list.length];
}
function missions(){
  const f=featuredStop(),w=S.week;
  return [
    {id:'tries',e:'🎧',t:'Add 3 new tracks to your playlist',have:w.tries,need:3,pts:5},
    {id:'produce',e:'🥬',t:'Try a new fruit or veg',have:w.produce,need:1,pts:4},
    {id:'stop',e:f.e,t:'Try something from '+f.n,have:w.stops.includes(f.k)?1:0,need:1,pts:5},
    {id:'cook',e:'🧑‍🍳',t:'Cook or prepare something yourself',have:w.cooked,need:1,pts:4,btn:'cook'},
    {id:'squad',e:'👯',t:'Taste test with a friend',have:w.squad,need:1,pts:4,btn:'squad'},
    {id:'encore',e:'🔁',t:'Give an old track an encore',have:w.encore,need:1,pts:3}
  ];
}
function checkMissions(){
  const w=S.week;let any=false;
  missions().forEach(m=>{if(m.have>=m.need&&!w.done[m.id]){w.done[m.id]=true;earn(m.pts,'Mission: '+m.t);toast('Mission complete! +'+fmt(m.pts)+' 🎯');any=true}});
  if(Object.keys(w.done).length>=6&&!w.bonus){w.bonus=true;earn(10,'All missions complete!');setTimeout(()=>toast('Tour week complete! +'+fmt(10)+' 🏆'),1600);any=true}
  if(any){save();fx()}
}
function checkPassport(stop){
  if(stop==='xx')return;
  const n=S.playlist.filter(p=>p.stop===stop).length;
  if(n>=3&&!S.passport[stop]){S.passport[stop]=true;earn(5,'Passport stamp: '+stopOf(stop).n);setTimeout(()=>toast('New passport stamp: '+stopOf(stop).n+' '+stopOf(stop).e),1200)}
  if(!S.passDone&&STOPS.every(s=>S.passport[s.k])){S.passDone=true;earn(25,'Full passport!');setTimeout(()=>toast('Passport complete! +'+fmt(25)+' 🌏'),2200)}
}
function checkMilestones(){
  const n=S.playlist.length;
  MILES.forEach(m=>{if(n>=m.n&&!S.mile[m.n]){S.mile[m.n]=true;earn(m.p,m.t+' unlocked!');setTimeout(()=>toast(m.t+'! +'+fmt(m.p)+' 💿'),1800)}});
}
function touchStreak(){
  const t=todayStr();if(S.lastStep===t)return;
  S.streak=(S.lastStep===yesterdayStr())?S.streak+1:1;S.lastStep=t;
  const b={3:2,5:3,7:5,10:8}[S.streak];
  if(b){earn(b,'Taste streak: '+S.streak+' days');setTimeout(()=>toast('Taste streak: '+S.streak+' days! +'+fmt(b)+' 🔥'),1000)}
  save();
}

  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;

/* ============ grown-up PIN ============ */
function pinPad(title,sub,onFour,shake){
  let v='';
  sheet(`<div class="center ${shake?'shake':''}"><h2>${title}</h2><p class="muted">${sub}</p><div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-k="${k}" aria-label="${k}">${k}</button>`).join('')}</div><button class="ghost" data-a="close">Cancel</button></div>`);
  const upd=()=>{document.getElementById('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')};
  upd();
  document.querySelectorAll('#sheet .key').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
    upd();
    if(v.length===4)setTimeout(()=>onFour(v),120);
  });
}
function withPin(cb){
  if(Date.now()<unlockedUntil){cb();return}
  if(!S.pin){setupPin(cb);return}
  askPin(cb,false);
}
function askPin(cb,again){
  pinPad('Grown-up check',again?'Not quite. Try again.':'Enter the PIN to confirm',v=>{
    if(v===S.pin){unlockedUntil=Date.now()+5*60000;hideSheet();cb()}
    else askPin(cb,true);
  },again);
}
function setupPin(cb){
  pinPad('Set a grown-up PIN','Choose 4 digits. A grown-up uses it for spot checks and to approve rewards.',a=>{
    pinPad('Confirm the PIN','Enter it once more',b=>{
      if(a===b){S.pin=a;save();unlockedUntil=Date.now()+5*60000;hideSheet();if(cb)cb();else render()}
      else setupPin(cb);
    });
  });
}

/* ============ quiz ============ */
function drawQuiz(){
  if(S.qDeck.length<5){
    const recent=S.qLast.slice(-20);
    S.qDeck=S.qDeck.concat(shuffle(QUIZ.map((_,i)=>i).filter(i=>!recent.includes(i)&&!S.qDeck.includes(i))));
  }
  const ids=S.qDeck.splice(0,5);
  S.qLast=S.qLast.concat(ids).slice(-60);
  return ids;
}
function ensureQuiz(){if(S.quiz.date!==todayStr()){S.quiz={date:todayStr(),ids:drawQuiz(),i:0,right:0,done:false,bonus:false};save()}}
function setOpts(){
  const cur=QUIZ[S.quiz.ids[S.quiz.i]];
  const o=cur.o.map((t,i)=>({t,ok:i===cur.c}));
  qUI.opts=cur.t==='mc'?shuffle(o):o;qUI.picked=null;
}

/* ============ ladder logic ============ */
function startTrial(it){
  if(inPlaylist(it.id)){toast('Already on your playlist. Try an encore!');return}
  if(inTrials(it.id)){toast('Already on your ladder');tab='home';render();return}
  if(S.trials.length>=6){toast('Finish or drop a challenge first (6 at a time)');return}
  S.trials.push({id:it.id,n:it.n,e:it.e,stop:it.stop||'xx',lv:it.lv||1,t:it.t||'m',d:it.d||'',done:0,started:todayStr(),pts:0,_v:null});
  save();fx();hideSheet();tab='home';render();window.scrollTo(0,0);
  toast('Challenge started: '+it.n+' '+it.e);
}
function finishBite(t){
  if(inPlaylist(t.id))return;
  const brave=t.lv===2?2:t.lv===3?4:0;
  if(brave){earn(brave,'Brave bonus: '+t.n);t.pts+=brave}
  S.playlist.push({id:t.id,n:t.n,e:t.e,stop:t.stop,lv:t.lv,stars:0,tags:[],note:'',tries:1,d:todayStr(),last:todayStr(),menu:false,v:!!t._v,pts:t.pts});
  S.week.tries+=1;
  if(t.stop==='pr'||t.t==='p')S.week.produce+=1;
  if(!S.week.stops.includes(t.stop))S.week.stops.push(t.stop);
  checkPassport(t.stop);checkMilestones();fx();
  setTimeout(()=>toast('New track added to your playlist! 🎧'),300);
}
function applyStep(t,idx){
  const st=STEPS[idx];
  t.done=idx+1;t.pts=(t.pts||0)+st.pts;
  earn(st.pts,st.t+': '+t.n);touchStreak();
  if(idx===3)finishBite(t);
  save();render();checkMissions();
}

  <h3>Flavour words (pick up to 3)</h3><div class="chips">${TAGS.map(t=>`<button class="fchip ${r.tags.includes(t)?'on':''}" data-a="rtag" data-v="${t}">${t}</button>`).join('')}</div>

/* ============ hungry / ideas ============ */
function ideaPool(cat){
  const need=NEEDS.find(n=>n[0]===cat)||NEEDS[4];
  return TASTE_BANK.filter(i=>need[3](i)&&!isKnown(i.id)&&!inPlaylist(i.id)&&!inTrials(i.id));
}
function drawIdeas(cat,n){
  const pool=ideaPool(cat),ids=pool.map(i=>i.id);
  let deck=(S.decks[cat]||[]).filter(id=>ids.includes(id));
  if(deck.length<n){
    const recent=S.recent.slice(-10);
    let fresh=shuffle(ids.filter(id=>!recent.includes(id)&&!deck.includes(id)));
    if(deck.length+fresh.length<n)fresh=shuffle(ids.filter(id=>!deck.includes(id)));
    deck=deck.concat(fresh);
  }
  const out=deck.splice(0,n);
  S.decks[cat]=deck;S.recent=S.recent.concat(out).slice(-40);save();
  return out.map(id=>pool.find(i=>i.id===id)).filter(Boolean);
}
function ideaSheet(){
  sheet(`<h2>Ideas for you</h2><p class="muted">Pick one to start a taste challenge. Ideas won't repeat until you've seen them all.</p>
  ${ideas.length?ideas.map(it=>`<button class="opt" data-a="startitem" data-v="${it.id}"><span class="e">${it.e}</span><span><b>${esc(it.n)}</b><small>${esc(it.d)}</small><small>${stopOf(it.stop).e} ${stopOf(it.stop).n} · ${LVLABEL[it.lv]}</small></span></button>`).join(''):'<p class="muted">Nothing left in this list. You have tried so much!</p>'}
  <div class="row"><button class="btn" data-a="moreideas">Show me more</button><button class="btn" data-a="need">Change mood</button><button class="btn" data-a="close">Close</button></div>`);
}

/* ============ actions ============ */
const actions={
  tab(d){tab=d.v;hideSheet();render();window.scrollTo(0,0)},
  close(){pending=null;closeSheet()},
  dismiss(){S.notice=null;save();render()},
  dset(d){draft.look[d.v]=d.v2;render()},
  picksym(d){draft.sym=+d.v;render()},
  step1(){draft.step=1;render()},
  step2(){
    const el=document.getElementById('nm');if(el)draft.name=el.value;
    if(!draft.name.trim()){toast('Type your name first');return}
    draft.step=2;render();window.scrollTo(0,0);
  },
  start(){
    if(draft.sym==null){toast('Pick a reward symbol');return}
    S.name=draft.name.trim();S.look=Object.assign({},DEFAULT_LOOK,draft.look);S.artists=draft.artists.map(a=>a.trim()).filter(Boolean);S.sym=draft.sym;
    save();fx();render();
    setTimeout(()=>{if(!S.pin)setupPin(null)},900);
  },
  petTap(){
    ensureQuiz();
    const p=document.querySelector('.pet');if(p){p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump')}
    if(qUI.mode==='ask'||qUI.mode==='fb'||qUI.mode==='end')return;
    if(!S.quiz.done){qUI.mode='offer';render();return}
    petSay='Quiz done today! You got '+S.quiz.right+' out of 5. Come back tomorrow for more.';
    render();setTimeout(()=>{petSay=null;render()},4500);
  },
  qlater(){qUI.mode='idle';render()},
  qstart(){ensureQuiz();qUI.mode='ask';setOpts();render()},
  qspeak(){const cur=QUIZ[S.quiz.ids[S.quiz.i]];speak(cur.q+'. '+qUI.opts.map(o=>o.t).join('. or. '))},
  qpick(d){
    if(qUI.mode!=='ask')return;
    const k=+d.v;qUI.picked=k;qUI.mode='fb';
    if(qUI.opts[k].ok){S.quiz.right+=1;earn(1,'Quiz answer')}
    save();render();
  },
  qnext(){
    if(S.quiz.i>=4){
      S.quiz.done=true;
      if(S.quiz.right===5&&!S.quiz.bonus){S.quiz.bonus=true;earn(3,'Perfect quiz bonus');fx()}
      save();qUI.mode='end';render();return;
    }
    S.quiz.i+=1;save();qUI.mode='ask';setOpts();render();
  },
  qdone(){qUI.mode='idle';render()},
  glow(d){
    const g=GLOW.find(x=>x.k===d.v);
    if(S.glow[d.v]){S.glow[d.v]=false;unearn(g.pts,g.t+' undone')}
    else{S.glow[d.v]=true;earn(g.pts,g.t);toast('Nice! +'+fmt(g.pts)+' '+g.e)}
    save();render();
  },
  /* taste bank */
  blv(d){bankLv=+d.v;render()},
  btype(d){bankType=d.v;render()},
  known(d){if(!isKnown(d.v)){S.known.push(d.v);save()}render();toast('Got it. We will hide that one.')},
  startitem(d){const it=TASTE_BANK.find(i=>i.id===d.v);if(it)startTrial(it)},
  surprise(){
    const comfort=Math.min(3,1+Math.floor(S.playlist.length/8));
    let pool=TASTE_BANK.filter(i=>i.lv<=comfort&&!isKnown(i.id)&&!inPlaylist(i.id)&&!inTrials(i.id));
    if(!pool.length)pool=TASTE_BANK.filter(i=>!inPlaylist(i.id)&&!inTrials(i.id));
    ideas=shuffle(pool).slice(0,3);ideaCat='any';ideaSheet();
  },
  need(){sheet(`<h2>What are you in the mood for?</h2>${NEEDS.map(n=>`<button class="opt" data-a="mood" data-v="${n[0]}"><span class="e">${n[1]}</span><span><b>${n[2]}</b></span></button>`).join('')}<div class="center"><button class="ghost" data-a="close">Never mind</button></div>`)},
  mood(d){ideaCat=d.v;ideas=drawIdeas(d.v,4);ideaSheet()},
  moreideas(){ideas=drawIdeas(ideaCat,4);ideaSheet()},
  custom(){sheet(`<h2>➕ Add my own challenge</h2><p class="muted">Found something new to try? Type it in and start a ladder.</p><input type="text" id="cname" maxlength="40" placeholder="What is it?" autocomplete="off" style="margin-bottom:10px"><h3>How brave is it?</h3><div class="row"><button class="btn" data-a="cgo" data-v="1">🌱 Easy</button><button class="btn" data-a="cgo" data-v="2">🔥 Adventurous</button><button class="btn" data-a="cgo" data-v="3">🚀 Brave</button></div><div class="center"><button class="ghost" data-a="close">Cancel</button></div>`)},
  cgo(d){const n=(document.getElementById('cname').value||'').trim();if(!n){toast('Type what you are trying first');return}startTrial({id:'c_'+Date.now(),n,e:'🍽️',stop:'xx',lv:+d.v,t:'m',d:'Your own find'})},
  /* ladder */
  drop(d){S.trials=S.trials.filter(t=>t.id!==d.v);save();render();toast('No worries. Come back any time.')},
  step(d){
    const t=inTrials(d.v);if(!t)return;
    const idx=+d.v2;
    if(idx===t.done-1&&idx<3){const st=STEPS[idx];t.done=idx;t.pts=Math.max(0,(t.pts||0)-st.pts);unearn(st.pts,'Step undone: '+t.n);render();return}
    if(idx!==t.done)return;
    if(idx===4){
      const pl=inPlaylist(t.id);
      rateDraft={id:t.id,n:t.n,stars:pl?pl.stars:0,tags:pl?pl.tags.slice():[],note:pl?pl.note:'',trial:true};
      rateSheet();return;
    }
    if(idx===3&&Math.random()*100<S.spot){
      pending={id:t.id,idx};
      sheet(`<div class="center"><div style="font-size:56px">🕵️</div><h2>Spot check!</h2><p>Show a grown-up your plate and your brave bite, then they enter the PIN so you get your points.</p></div><button class="big" data-a="spotok" style="background:var(--grass);margin-bottom:10px">A grown-up is here</button><div class="center"><button class="ghost" data-a="close">Not now</button></div>`);
      return;
    }
    t._v=false;applyStep(t,idx);
  },
  spotok(){
    const p=pending;if(!p)return;
    withPin(()=>{const t=inTrials(p.id);pending=null;if(!t)return;t._v=true;hideSheet();applyStep(t,p.idx);toast('Spot check passed! 🎉')});
  },
  rstar(d){rateDraft.stars=+d.v;const n=document.getElementById('rnote');if(n)rateDraft.note=n.value;rateSheet()},
  rtag(d){const n=document.getElementById('rnote');if(n)rateDraft.note=n.value;const i=rateDraft.tags.indexOf(d.v);if(i>=0)rateDraft.tags.splice(i,1);else if(rateDraft.tags.length<3)rateDraft.tags.push(d.v);rateSheet()},
  rsave(){
    const r=rateDraft;r.note=(document.getElementById('rnote').value||'').trim();
    if(!r.stars){toast('Tap a star rating first');return}
    const pl=inPlaylist(r.id);
    if(pl){pl.stars=r.stars;pl.tags=r.tags.slice();pl.note=r.note}
    hideSheet();
    const t=inTrials(r.id);
    if(r.trial&&t&&t.done===4){applyStep(t,4);S.trials=S.trials.filter(x=>x.id!==r.id);if(pl)pl.pts=(pl.pts||0)+2;save();render();toast('Review saved! 🎤')}
    else{save();render();toast('Review updated ⭐')}
    rateDraft=null;
  },
  rerate(d){const p=inPlaylist(d.v);if(!p)return;rateDraft={id:p.id,n:p.n,stars:p.stars,tags:p.tags.slice(),note:p.note,trial:false};rateSheet()},
  encore(d){
    const p=inPlaylist(d.v);
    if(!p){const it=TASTE_BANK.find(i=>i.id===d.v);if(it)startTrial(it);return}
    p.tries+=1;p.last=todayStr();
    if(!S.week.encoreIds.includes(p.id)){S.week.encoreIds.push(p.id);S.week.encore+=1;earn(2,'Encore: '+p.n);toast('Encore! +'+fmt(2)+' 🔁')}
    else toast('Encore noted. Nice persistence!');
    save();render();checkMissions();
    rateDraft={id:p.id,n:p.n,stars:p.stars,tags:p.tags.slice(),note:p.note,trial:false};rateSheet();
  },
  menu(d){const p=inPlaylist(d.v);if(p){p.menu=!p.menu;save();render();toast(p.menu?'Added to your menu 🍽️':'Removed from menu')}},
  /* missions and squad */
  cook(){sheet(`<h2>🧑‍🍳 What did you make?</h2><input type="text" id="cooked" maxlength="40" placeholder="e.g. Veggie fried rice" autocomplete="off" style="margin-bottom:10px"><button class="big" data-a="cookgo" style="background:var(--grass)">Log it</button><div class="center"><button class="ghost" data-a="close">Cancel</button></div>`)},
  cookgo(){const n=(document.getElementById('cooked').value||'').trim();if(!n){toast('Type what you made');return}S.week.cooked+=1;earn(2,'Cooked: '+n);save();hideSheet();render();checkMissions();fx();toast('Chef! +'+fmt(2)+' 🧑‍🍳')},
  sqadd(){const el=document.getElementById('sqname'),v=(el.value||'').trim();if(!v)return;if(S.squad.length<12)S.squad.push(v);save();render()},
  sqdel(d){S.squad.splice(+d.v,1);save();render()},
  squad(){
    sheet(`<h2>👯 Squad taste test</h2><p class="muted">Who did you taste with, and what was it?</p>
    <div class="chips">${S.squad.map((n,i)=>`<button class="fchip" data-a="sqpick" data-v="${i}">${esc(n)}</button>`).join('')}<button class="fchip" data-a="sqpick" data-v="-1">A friend</button></div>
    <input type="text" id="sqfood" maxlength="40" placeholder="What did you taste?" autocomplete="off" style="margin-bottom:10px"><p class="muted" id="sqwho">Tap a name above, or just log it.</p>
    <button class="big" data-a="sqgo" style="background:var(--grass)">Log it</button><div class="center"><button class="ghost" data-a="close">Cancel</button></div>`);
    squad.who='A friend';
  },
  sqpick(d){const i=+d.v;squad.who=i<0?'A friend':S.squad[i];const el=document.getElementById('sqwho');if(el)el.textContent='With: '+squad.who},
  sqgo(){const f=(document.getElementById('sqfood').value||'').trim()||'something new';S.week.squad+=1;earn(3,'Squad taste test with '+(squad.who||'a friend')+': '+f);save();hideSheet();render();checkMissions();fx();toast('Squad goals! +'+fmt(3)+' 👯')},
  treatopen(){sheet(`<h2>🧁 Pick your weekend treat</h2><p class="muted">You earned it! We'll make it together.</p>${TREATS.map((x,i)=>`<button class="opt" data-a="treatset" data-v="${i}"><span class="e">${x[0]}</span><span><b>${x[1]}</b></span></button>`).join('')}<h3>Or your own idea</h3><div class="row"><input type="text" id="mytreat" maxlength="30" placeholder="Type your idea" autocomplete="off"><button class="btn grass" data-a="treatown">Choose</button></div><div class="center"><button class="ghost" data-a="close">Later</button></div>`)},
  treatset(d){const x=TREATS[+d.v];S.treat={week:S.week.start,item:x[0]+' '+x[1]};save();fx();closeSheet();toast('Treat picked! 🧁')},
  treatown(){const v=(document.getElementById('mytreat').value||'').trim();if(!v)return;S.treat={week:S.week.start,item:'🧁 '+v};save();fx();closeSheet();toast('Treat picked! 🧁')},
  /* studio */
  studio(){hideSheet();studioSheet()},
  scat(d){studioCat=d.v;studioSheet()},
  sset(d){
    const o=optsFor(studioCat).find(x=>x.id===d.v);
    if(!o)return;
    if(o.lv>level()){toast('Unlocks at level '+o.lv+' 🔒');return}
    S.look[studioCat]=o.id;save();studioSheet();
  },
  studiodone(){
    const n=(document.getElementById('pname').value||'').trim();if(n)S.name=n;
    S.artists=[0,1,2].map(i=>(document.getElementById('part'+i).value||'').trim()).filter(Boolean);
    save();closeSheet();
  },
  /* rewards and grown-ups */
  buy(d){
    const r=S.rewards.find(x=>x.id===d.v);if(!r||S.balance<r.c)return;
    withPin(()=>{S.balance-=r.c;logIt(-r.c,'Got: '+r.n);save();fx();render();toast('Enjoy: '+r.n+' 🎁')});
  },
  rewardsmgr(){withPin(()=>rewardsSheet())},
  rwadd(){
    const n=(document.getElementById('rw-name').value||'').trim(),c=Math.max(1,parseInt(document.getElementById('rw-cost').value,10)||0),e=(document.getElementById('rw-emoji').value||'').trim()||'🎁';
    if(!n||!c){toast('Add a name and a cost');return}
    S.rewards.push({id:'r'+Date.now(),e,n,c});save();rewardsSheet();
  },
  rwdel(d){S.rewards=S.rewards.filter(r=>r.id!==d.v);save();rewardsSheet()},
  grown(){withPin(()=>grownSheet())},
  spotdelta(d){S.spot=Math.max(0,Math.min(100,S.spot+(+d.v)));save();grownSheet()},
  givebonus(){const n=parseInt(document.getElementById('bonus-n').value,10);if(!n)return;if(n>0)earn(n,'Bonus from a grown-up');else{S.balance=Math.max(0,S.balance+n);logIt(n,'Adjustment');save()}grownSheet();toast('Done')},
  verify(d){const p=inPlaylist(d.v);if(p&&!p.v){p.v=true;earn(1,'Verified: '+p.n);save();reviewSheet()}},
  undotrack(d){
    const p=inPlaylist(d.v);if(!p)return;
    unearn(p.pts||0,'Removed: '+p.n);
    S.playlist=S.playlist.filter(x=>x.id!==d.v);
    S.week.tries=Math.max(0,S.week.tries-1);save();reviewSheet();
  },
  review(){reviewSheet()},
  changepin(){S.pin=null;unlockedUntil=0;setupPin(null)},
  resetall(){if(confirm('Erase everything and start over? This cannot be undone.')){const pin=S.pin;S=defaults();S.pin=pin;draft={name:'',look:Object.assign({},DEFAULT_LOOK),artists:['','',''],sym:null,step:1};qUI={mode:'idle',opts:[],picked:null};save();closeSheet()}}
};
const squad={who:'A friend'};
function grownSheet(){
  const unchecked=S.playlist.filter(p=>!p.v).length;
  sheet(`<h2>Grown-ups</h2><p class="muted" style="margin-top:-4px">${BUILD}</p>
  <div class="card"><b>Spot check chance</b><p class="muted" style="margin:4px 0 8px">How often a full bite needs a grown-up to confirm with the PIN. Other times she self-logs.</p><div class="row" style="align-items:center"><button class="btn" data-a="spotdelta" data-v="-25">−</button><div class="center"><b style="font-size:26px">${S.spot}%</b></div><button class="btn" data-a="spotdelta" data-v="25">+</button></div></div>
  <button class="opt" data-a="review"><span class="e">🔍</span><span><b>Review recent tries</b><small>${unchecked} self-logged track${unchecked===1?'':'s'} to check</small></span></button>
  <div class="card"><b>Give or take ${esc(sy()[2])}</b><div class="row" style="margin-top:8px"><input type="number" id="bonus-n" placeholder="e.g. 5 or -5" inputmode="numeric"><button class="btn grass" data-a="givebonus">Apply</button></div></div>
  <button class="opt" data-a="rewardsmgr"><span class="e">🎁</span><span><b>Manage rewards</b><small>Add, price and remove</small></span></button>
  <button class="opt" data-a="changepin"><span class="e">🔑</span><span><b>Change PIN</b></span></button>
  <button class="opt" data-a="resetall"><span class="e">🗑️</span><span><b>Start over</b><small>Erases everything on this device</small></span></button>
  <div class="card mint"><b>Tip</b><br>Praise bravery and curiosity, not how much she eats or her body. Honest "not for me yet" ratings are welcome, and re-tries are what build liking.</div>
  <div class="center"><button class="btn" data-a="close">Done</button></div>`);
}
function reviewSheet(){
  const list=S.playlist.filter(p=>!p.v).slice().reverse().slice(0,20);
  sheet(`<h2>🔍 Review recent tries</h2><p class="muted">Confirm what she logged, or remove a track that did not happen (its points are taken back).</p>
  ${list.length?list.map(p=>`<div class="reward"><span class="e">${p.e}</span><span class="t"><b>${esc(p.n)}</b><br><span class="muted">${p.d}</span></span><button class="btn sm grass" data-a="verify" data-v="${esc(p.id)}">✔ Confirm +1</button><button class="btn sm berry" data-a="undotrack" data-v="${esc(p.id)}">Remove</button></div>`).join(''):'<p class="muted">Nothing to check right now.</p>'}
  <div class="center" style="margin-top:12px"><button class="btn" data-a="grown">Back</button></div>`);
}
function rewardsSheet(){
  sheet(`<h2>🎁 Rewards</h2><p class="muted">Add things she can save up for, and set the price.</p>
  ${S.rewards.map(r=>`<div class="reward"><span class="e">${r.e}</span><span class="t"><b>${esc(r.n)}</b><br><span class="muted">${sy()[0]} ${r.c}</span></span><button class="btn berry sm" data-a="rwdel" data-v="${r.id}">Remove</button></div>`).join('')||'<p class="muted">No rewards yet.</p>'}
  <div class="card" style="margin-top:12px"><b>Add a reward</b>
  <input type="text" id="rw-name" maxlength="50" placeholder="Reward name" style="margin:8px 0" autocomplete="off">
  <div class="row"><input type="number" id="rw-cost" placeholder="Cost" inputmode="numeric"><input type="text" id="rw-emoji" maxlength="4" placeholder="Emoji (optional)"></div>
  <div style="height:10px"></div><button class="btn grass" data-a="rwadd" style="width:100%">Add reward</button></div>
  <div class="center"><button class="btn" data-a="close">Done</button></div>`);
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a&&actions[a.dataset.a]){actions[a.dataset.a](a.dataset);return}
  if(e.target.id==='overlay')closeSheet();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;
  if(k==='stop'){bankStop=e.target.value;render()}
  if(k==='hide'){bankHide=e.target.checked;render()}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;
  if(k==='name')draft.name=e.target.value;
  if(k&&k.startsWith('artist'))draft.artists[+k.slice(6)]=e.target.value;
  if(k==='mq'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.bankwrap details').forEach(d=>{d.style.display=(!q||d.dataset.name.includes(q))?'':'none'})}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if('serviceWorker' in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=3').then(r=>r.update()).catch(()=>{}));
}
render();
</script>
</body>
</html>
